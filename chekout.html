<main class="page-layout">
    <h2>Оформлення замовлення</h2>
    <form action="#" method="POST" class="checkout-form">
    <fieldset>
  <legend>1. Особисті дані</legend>
  <div class="form-group">
    <label for="fullName">ПІБ:</label>
    <input
      type="text"
      id="fullName"
      name="fullName"
      required
      placeholder="Іванов Іван Іванович"
    />
  </div>
  <div class="form-group">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required />
    </div>
    <div class="form-group">
        <label for="phone">Телефон:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            pattern="[\+]\d{2}\d{10}"
            placeholder="+380991234567"
            required
            title="Формат: +380XXXXXXXXX"
        />
    </div>
    </fieldset>
        <fieldset>
    <legend>2. Спосіб доставки</legend>
    <div class="form-radio">
        <input
      type="radio"
      id="deliveryNova"
      name="delivery"
      value="nova_poshta"
      checked
        />
        <label for="deliveryNova">Нова Пошта</label>
    </div>
     <div class="form-radio">
        <input
      type="radio"
      id="deliveryCourier"
      name="delivery"
      value="courier"
        />
        <label for="deliveryCourier">Кур'єр за адресою</label>
    </div>

    <div class="form-group">
        <label for="city">Місто:</label>
     <select id="city" name="city">
        <option value="kyiv">Київ</option>
        <option value="lviv">Львів</option>
        <option value="odesa">Одеса</option>
        <option value="kropyvnytski">Кропивницький</option>
        <option value="kremenchuk">Кременчук</option>
        <option value="zhitomyr">Житомир</option>
        <option value="ivano-frankivsk">Івано-Франківськ</option>
        <option value="kharkiv">Харків</option>
        <option value="kriviy-righ">Кривий Ріг</option>
        <option value="mykolaiv">Миколаїв</option>
        <option value="vinitsa">Вінниця</option>
        </select>
    </div>
    </fieldset>
    <div class="agree-wrapper">
    <label class="agree-label">
        <input type="checkbox" name="agree" required>
        <span>Я ознайомився(-лась) та погоджуюсь з правилами магазину</span>
    </label>
</div>
    <button type="submit" class="btn btn-primary">Підтвердити замовлення</button>
    </form>
</main>
